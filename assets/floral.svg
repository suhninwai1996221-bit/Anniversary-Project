<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="roseGrad" cx="42%" cy="42%" r="65%">
      <stop offset="0" stop-color="#f6a8b8"/>
      <stop offset="0.45" stop-color="#e2607e"/>
      <stop offset="1" stop-color="#a63a55"/>
    </radialGradient>
    <radialGradient id="roseGradDark" cx="42%" cy="42%" r="65%">
      <stop offset="0" stop-color="#e890aa"/>
      <stop offset="0.5" stop-color="#c44d6a"/>
      <stop offset="1" stop-color="#7e2c44"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d7a3a"/>
      <stop offset="1" stop-color="#2e4420"/>
    </linearGradient>
    <radialGradient id="goldDot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="1" stop-color="#d4a24e"/>
    </radialGradient>
  </defs>

  <g id="bouquet">
    <!-- leaves -->
    <path d="M12 4 C 40 18, 66 46, 74 96 C 40 84, 14 52, 12 4 Z" fill="url(#leafGrad)" opacity="0.95"/>
    <path d="M4 12 C 18 44, 34 74, 62 104 C 26 100, 2 66, 4 12 Z" fill="#3c5428" opacity="0.9"/>
    <path d="M30 0 C 74 6, 110 26, 132 76 C 84 66, 46 38, 30 0 Z" fill="#465f2e" opacity="0.85"/>

    <!-- stems -->
    <path d="M6 6 Q 60 40 118 118" stroke="#4a5c2c" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M10 10 Q 40 66 70 130" stroke="#4a5c2c" stroke-width="2.4" fill="none" opacity="0.7"/>

    <!-- big rose -->
    <g transform="translate(58 52)">
      <circle r="21" fill="url(#roseGrad)"/>
      <circle r="15.5" fill="none" stroke="#7e2c44" stroke-width="1.6" opacity="0.8"/>
      <path d="M -9 -2 a 9 9 0 1 1 12 8 a 6 6 0 1 0 -9 -6 a 3.4 3.4 0 1 1 4.6 3.4" fill="none" stroke="#7e2c44" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="-7" cy="-8" r="3.2" fill="#ffd3dc" opacity="0.7"/>
    </g>

    <!-- medium rose -->
    <g transform="translate(24 96)">
      <circle r="15" fill="url(#roseGradDark)"/>
      <circle r="10.5" fill="none" stroke="#5f1f33" stroke-width="1.3" opacity="0.85"/>
      <path d="M -6 0 a 6 6 0 1 1 8 5.5 a 4 4 0 1 0 -6 -4 a 2.4 2.4 0 1 1 3.2 2.4" fill="none" stroke="#5f1f33" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- small rose -->
    <g transform="translate(112 26)">
      <circle r="12" fill="url(#roseGrad)"/>
      <path d="M -5 0 a 5 5 0 1 1 6.6 4.6 a 3.4 3.4 0 1 0 -5 -3.3" fill="none" stroke="#7e2c44" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- buds -->
    <circle cx="92" cy="88" r="6.5" fill="#d44d6c"/>
    <circle cx="140" cy="64" r="5" fill="#e2607e"/>
    <circle cx="52" cy="128" r="5.5" fill="#c44d6a"/>

    <!-- gold dots / baby's breath -->
    <circle cx="86" cy="34" r="2.6" fill="url(#goldDot)"/>
    <circle cx="34" cy="52" r="2.2" fill="url(#goldDot)"/>
    <circle cx="120" cy="108" r="2.4" fill="url(#goldDot)"/>
    <circle cx="66" cy="96" r="1.8" fill="#f6e2a8"/>
    <circle cx="150" cy="92" r="1.9" fill="#f6e2a8"/>
    <circle cx="18" cy="130" r="2.1" fill="url(#goldDot)"/>
  </g>
</svg>
